<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FarmDirect</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-lowest":"#ffffff","inverse-surface":"#303030","surface-variant":"#e4e2e1",
              "error":"#ba1a1a","on-primary-container":"#9dd090","outline-variant":"#c2c9bb",
              "primary-container":"#2d5a27","error-container":"#ffdad6","surface-container-low":"#f6f3f2",
              "on-secondary":"#ffffff","tertiary-container":"#803e00","on-secondary-fixed":"#131e17",
              "on-tertiary-fixed-variant":"#723600","on-primary":"#ffffff","on-primary-fixed-variant":"#23501e",
              "inverse-primary":"#a1d494","secondary":"#556158","surface-container":"#f0eded","surface":"#fbf9f8",
              "surface-bright":"#fbf9f8","on-tertiary":"#ffffff","surface-container-high":"#eae8e7",
              "secondary-fixed-dim":"#bdcabe","tertiary-fixed":"#ffdcc6","on-tertiary-container":"#ffb17d",
              "primary-fixed-dim":"#a1d494","primary":"#154212","on-secondary-fixed-variant":"#3e4a41",
              "on-tertiary-fixed":"#311300","secondary-fixed":"#d9e6da","on-surface":"#1b1c1c",
              "surface-tint":"#3b6934","on-error-container":"#93000a","on-error":"#ffffff",
              "on-secondary-container":"#5b675e","surface-dim":"#dcd9d9","secondary-container":"#d9e6da",
              "on-primary-fixed":"#002201","outline":"#72796e","on-background":"#1b1c1c",
              "surface-container-highest":"#e4e2e1","tertiary":"#5e2b00","inverse-on-surface":"#f3f0f0",
              "on-surface-variant":"#42493e","background":"#fbf9f8","primary-fixed":"#bcf0ae",
              "tertiary-fixed-dim":"#ffb786","ai-accent":"#F57C00"
            },
            borderRadius: { DEFAULT:"0.25rem", lg:"0.5rem", xl:"0.75rem", full:"9999px" },
            spacing: {
              base:"8px","stack-sm":"12px","stack-md":"24px","stack-lg":"48px",
              "container-padding-desktop":"32px","container-padding-mobile":"16px","gutter-grid":"24px"
            },
            fontFamily: {
              "body-md":["Work Sans"],"label-xs":["Work Sans"],"headline-lg-mobile":["Manrope"],
              "label-sm":["Work Sans"],"headline-lg":["Manrope"],"display-lg":["Manrope"],
              "headline-md":["Manrope"],"body-lg":["Work Sans"]
            },
            fontSize: {
              "body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],
              "label-xs":["12px",{lineHeight:"16px",fontWeight:"500"}],
              "headline-lg-mobile":["24px",{lineHeight:"32px",fontWeight:"600"}],
              "label-sm":["14px",{lineHeight:"20px",letterSpacing:"0.02em",fontWeight:"600"}],
              "headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.01em",fontWeight:"600"}],
              "display-lg":["48px",{lineHeight:"56px",letterSpacing:"-0.02em",fontWeight:"700"}],
              "headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],
              "body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}]
            }
          }
        }
      }
    </script>

    <style>
      body { background-color: #fbf9f8; color: #1b1c1c; font-family: 'Work Sans', sans-serif; }
      h1,h2,h3,h4,h5,h6,.font-headline { font-family: 'Manrope', sans-serif; }
      .ambient-shadow-1 { box-shadow: 0px 4px 12px rgba(45,90,39,0.05); }
      .ambient-shadow-2 { box-shadow: 0px 8px 24px rgba(0,0,0,0.08); }
      .hover-lift { transition: transform .2s ease, box-shadow .2s ease; }
      .hover-lift:hover { transform: translateY(-2px); box-shadow: 0px 12px 32px rgba(45,90,39,0.12); }
      .card-shadow { box-shadow: 0px 4px 12px rgba(45,90,39,0.05); }
      .card-hover:hover { box-shadow: 0px 12px 32px rgba(45,90,39,0.12); transform: translateY(-2px); transition: all .3s ease; }
      .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
      .icon-fill { font-variation-settings: 'FILL' 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
